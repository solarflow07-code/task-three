<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма заявки</title>
    <!-- Підключення Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="form-card">
      <div class="form-header">
        <h2>Оформлення заявки</h2>
        <p>Заповніть форму, і ми зв'яжемося з вами найближчим часом</p>
      </div>

      <form id="leadForm" novalidate>
        <div class="hp-field">
          <input type="text" id="website_hp" name="website" style="display: none" tabindex="-1" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="userName">Ім’я</label>
          <div class="input-wrapper">
            <input type="text" id="userName" class="form-control" placeholder="Введіть ваше ім’я" required />
          </div>
          <div id="nameError" class="error">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Ім’я повинно містити лише літери.
          </div>
        </div>

        <div class="form-group">
          <label for="userPhone">Телефон</label>
          <div class="input-wrapper">
            <input type="text" id="userPhone" class="form-control" placeholder="+380 (XX) XXX-XX-XX" required />
          </div>
          <div id="phoneError" class="error">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            Введіть коректний номер телефону.
          </div>
        </div>

        <button type="submit" class="btn-submit">Надіслати заявку</button>
      </form>
    </div>

    <script src="/js/main.js"></script>
  </body>
</html>
