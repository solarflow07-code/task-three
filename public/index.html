<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма заявки</title>
    <!-- Подключение маски для телефона -->
    <script src="https://unpkg.com/imask"></script>
    <style>
        .error { color: red; font-size: 12px; display: none; }
        .hp-field { display: none !important; } /* Сховане поле для спам-ботів */
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

<form id="leadForm">
    <!-- Honeypot антиспам поле -->
    <div class="hp-field">
        <input type="text" id="website_hp" name="website_hp" autocomplete="off">
    </div>

    <div class="form-group">
        <label for="userName">Ім’я:</label><br>
        <input type="text" id="userName" required>
        <div id="nameError" class="error">Ім’я повинно містити лише літери (українські або латинські).</div>
    </div>

    <div class="form-group">
        <label for="userPhone">Телефон:</label><br>
        <input type="text" id="userPhone" placeholder="+380 (XX) XXX-XX-XX" required>
        <div id="phoneError" class="error">Введіть коректний номер телефону.</div>
    </div>

    <button type="submit">Надіслати</button>
</form>

<script>
    // 1. Налаштування маски для українських операторів
    const phoneInput = document.getElementById('userPhone');
    const maskOptions = {
        mask: '+3{80} (00) 000-00-00',
        lazy: false
    };
    const mask = IMask(phoneInput, maskOptions);

    // Фіксація часу завантаження сторінки (Anti-Spam)
    const pageLoadTime = Date.now();

    // 2. Валідація та відправка
    const form = document.getElementById('leadForm');
    const nameInput = document.getElementById('userName');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        let isValid = true;
        const nameRegex = /^[a-zA-Zа-яА-ЯіІїЇєЄґҐ\s]+$/;

        // Перевірка імені
        if (!nameRegex.test(nameInput.value.trim())) {
            document.getElementById('nameError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('nameError').style.display = 'none';
        }

        // Перевірка завершеності маски телефону
        if (!mask.isComplete) {
            document.getElementById('phoneError').style.display = 'block';
            isValid = false;
        } else {
            document.getElementById('phoneError').style.display = 'none';
        }

        // --- Антиспам перевірки ---
        const honeypot = document.getElementById('website_hp').value;
        const submitTime = Date.now();
        const timeDiff = (submitTime - pageLoadTime) / 1000; // в секундах

        // Якщо заповнено honeypot або форму надіслано швидше ніж за 2 секунди
        if (honeypot !== '' || timeDiff < 2) {
            console.warn('Spam detected');
            alert('Дякуємо! Ваша заявка прийнята.'); // Удаваний успіх для бота
            return;
        }

        if (!isValid) return;

        // Передача даних на свій сервер
        const payload = {
            fName: nameInput.value.trim(),
            phone: mask.unmaskedValue // Отримуємо чистий номер без символів маски: 380XXXXXXXXX
        };

        try {
            const response = await fetch('/api/leads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert('Заявку успішно відправлено!');
                form.reset();
                mask.value = '';
            } else {
                alert('Помилка відправки. Спробуйте пізніше.');
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body>
</html>
